# Fixa o nome do projeto (rede webhooksite_default, volume webhooksite_redis-data) seja qual for a pasta.
name: webhooksite

services:
  app:
    build: .
    ports:
      - "8084:8080"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    container_name: "webhook-redis"
    image: "redis:8.10.2-alpine"
    volumes:
      # Tokens e mensagens sobrevivem a `docker compose down` (o Redis grava o dump.rdb em /data).
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
