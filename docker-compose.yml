# Fixa o nome do projeto (rede anzol_default, volume anzol_redis-data) seja qual for a pasta.
name: anzol

# Só o padrão do app: MCP, IA local, saída para a rede privada e exportação OTLP ficam desligados. Para ligar algum,
# crie um docker-compose.override.yml ao lado deste arquivo (fora do git; o compose o carrega sozinho): o modelo está
# em docs/operacao.md.
services:
  app:
    build: .
    ports:
      # Só no loopback do host: um override com ANZOL_OUTBOUND_ALLOW_PRIVATE=true herda esta porta, e publicada em
      # todas as interfaces ("8084:8080") ela transforma o send num proxy para a LAN, para a rede do Docker (o Redis) e
      # para a própria máquina, aberto a qualquer um na mesma rede, sem credencial (o POST /token é aberto).
      - "127.0.0.1:8084:8080"
    environment:
      - REDIS_HOST=redis
      # Contra DNS rebinding e CSRF (o padrão do app, escrito aqui para quem quiser acrescentar um nome): Host de
      # /token, /share e /mcp só com estes nomes, em qualquer porta; Origin dos métodos que mudam estado só na porta do
      # Host (ou nome:porta na lista). A captura e a tela não conferem. "*" desliga: inseguro.
      - ANZOL_ALLOWED_HOSTS=localhost,127.0.0.1,[::1],host.docker.internal
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    container_name: "anzol-redis"
    image: "redis:8.10.2-alpine"
    # Teto de memória: cheio, o Redis recusa gravação (o webhook responde 507) em vez de despejar
    # chaves; nenhum token some. O que já está gravado continua legível. A limpeza por URL
    # (auto_cleanup / ANZOL_MAX_REQUESTS) é o que mantém o uso abaixo do teto.
    command: ["redis-server", "--maxmemory", "1gb", "--maxmemory-policy", "noeviction"]
    volumes:
      # Tokens e mensagens sobrevivem a `docker compose down` (o Redis grava o dump.rdb em /data).
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
