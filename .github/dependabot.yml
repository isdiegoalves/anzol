# Pull request de atualização semanal das dependências de cada pasta. As atualizações de minor e patch de um mesmo
# ecossistema vêm juntas num pull request só; major vem separado. Docker não propõe major: o Node 24 e o Java 25 do
# Dockerfile são escolhas de versão com suporte longo, não a tag mais nova.
version: 2
updates:
  - package-ecosystem: gradle
    directories: ["/backend", "/cli"]
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      gradle:
        update-types: ["minor", "patch"]
    # O appender do logback sobe junto com o OTel que o Spring Boot gerencia, não sozinho (backend/build.gradle.kts).
    ignore:
      - dependency-name: "io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: npm
    directories: ["/frontend", "/tests/contract"]
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        update-types: ["minor", "patch"]
    # Os tipos do Node acompanham o Node 24 do Dockerfile e dos workflows: o major dos tipos só sobe junto com o runtime.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # O axe 4.14 passa a cobrar a WCAG 2.5.3 (o nome acessível contém o texto visível) em linhas da lista que
      # ainda não cumprem; ele sobe junto com essa correção da tela.
      - dependency-name: "axe-core"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@axe-core/playwright"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        update-types: ["minor", "patch"]
