# Publica a imagem no GitHub Container Registry a cada tag de versão (vX.Y.Z), para amd64 e arm64, e cria a release
# do GitHub com o texto da tag anotada: o assunto vira o título e o corpo, as notas. Tag sem notas não publica nada.
# O Helm (helm/) usa ghcr.io/isdiegoalves/anzol com a tag da versão.
name: imagem

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Notas da release (corpo da tag anotada)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents:subject)' "$TAG" > titulo.txt
          git tag -l --format='%(contents:body)' "$TAG" > notas.md
          test -s notas.md || { echo "::error::A tag $TAG não tem notas no corpo da mensagem (git tag -a --cleanup=verbatim -F notas.md)"; exit 1; }
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/anzol
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            ANZOL_VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Release no GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$(cat titulo.txt)" --notes-file notas.md
