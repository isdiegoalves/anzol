# Publica a imagem no GitHub Container Registry a cada tag de versão (vX.Y.Z), para amd64 e arm64, e cria a release
# do GitHub com o texto da tag anotada: o assunto vira o título e o corpo, as notas. Tag sem notas não publica nada.
# O Helm (helm/) usa ghcr.io/isdiegoalves/anzol com a tag da versão.
name: imagem

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notas da release (corpo da tag anotada)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents:subject)' "$TAG" > titulo.txt
          git tag -l --format='%(contents:body)' "$TAG" > notas.md
          test -s notas.md || { echo "::error::A tag $TAG não tem notas no corpo da mensagem (git tag -a --cleanup=verbatim -F notas.md)"; exit 1; }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/anzol
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Release no GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$(cat titulo.txt)" --notes-file notas.md
