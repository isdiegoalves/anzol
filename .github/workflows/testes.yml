# Testes rápidos a cada push e pull request: backend, CLI e frontend. Contrato, E2E e regressão visual
# continuam no ./ci.sh local (as baselines visuais são gravadas em arm64 e não batem num runner amd64).
name: testes

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      # Os testes sobem Redis por Testcontainers; o runner já tem Docker.
      - run: ./gradlew check
        working-directory: backend

  # O CLI é construído com o JDK 25 e roda em Java 21 ou mais novo: os testes (que disparam o CLI como processo) rodam
  # em cada Java da matriz. O último java-version da lista é o padrão do runner, o que o Gradle usa para construir.
  cli:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.java }}
            25
      # O cache basic tem uma chave só para o repositório inteiro: só o job do backend grava, senão os jobs disputam a
      # mesma chave e só o primeiro consegue salvar.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true
      - run: ./gradlew check installDist -PtestJavaVersion=${{ matrix.java }}
        working-directory: cli
      # Sem a variável do setup-java, o script do anzol usaria o java do PATH (o 25) e o passo passaria sem testar
      # nada: falha explicitamente, e confere a versão do Java que de fato roda.
      - name: O CLI instalado roda no Java ${{ matrix.java }}
        env:
          JAVA_DA_MATRIZ: JAVA_HOME_${{ matrix.java }}_X64
        run: |
          export JAVA_HOME="${!JAVA_DA_MATRIZ:?o setup-java não definiu $JAVA_DA_MATRIZ: sem ele o passo rodaria no Java do PATH}"
          "$JAVA_HOME/bin/java" -version 2>&1 | grep -F '"${{ matrix.java }}.'
          cli/build/install/anzol/bin/anzol --help

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx ng lint
      - run: npm run -s lint:styles
      - name: i18n extraído (messages.json igual ao do ng extract-i18n)
        run: npx ng extract-i18n && git diff --exit-code src/locale/messages.json
      - run: npx prettier --check .
      - run: npx ng test --watch=false
      - run: npx ng build
