# Anzol: uma imagem só (API, webhook, tela, SSE em /token/{id}/stream e MCP em /mcp, na porta 8080) e o Redis 8,
# único armazenamento. As variáveis do app estão na seção "Configuração" de docs/operacao.md; o uso, em docs/helm.md.

image:
  repository: ghcr.io/isdiegoalves/anzol
  # O workflow imagem.yml publica a imagem a cada tag de versão vX.Y.Z (tags X.Y.Z, X.Y e latest): escreva aqui a tag
  # publicada. Sem tag de versão publicada, construa com o Dockerfile da raiz e publique.
  tag: latest
  pullPolicy: IfNotPresent

# Pacote do ghcr.io é privado até ser tornado público: aqui vai o Secret docker-registry, ex. [{name: ghcr}].
imagePullSecrets: []

# O SSE e o `requests/wait` guardam os assinantes em memória: o app roda com uma réplica só (fixa no Deployment).

service:
  port: 80

ingress:
  enabled: false
  className: nginx
  # Hosts do Ingress (nome, sem esquema nem porta). Cada um entra sozinho no ANZOL_ALLOWED_HOSTS (ver `webhook`).
  hosts: []
  #  - anzol.example.com
  # tls:
  #  - secretName: anzol-tls
  #    hosts: [anzol.example.com]
  tls: []
  # Para o ingress-nginx. Com outro controlador, traduza cada uma.
  annotations:
    # SSE (/token/{id}/stream, /mcp): sem buffer, cada evento chega na hora.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # O SSE fica aberto (heartbeat a cada 15 s), o `requests/wait` espera até 300 s e a IA até 90 s: o padrão de 60 s
    # cortaria os dois últimos com 504.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # O app é quem corta o corpo (1 MiB, e 2 MiB no `send`) com a resposta do app antigo; o nginx só não pode cortar antes.
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    # Uma regra de resposta põe até 8 KiB num cabeçalho; com o buffer padrão (4 KiB) o nginx responderia 502.
    nginx.ingress.kubernetes.io/proxy-buffer-size: "64k"

# Variáveis ANZOL_* do app (seção "Configuração" de docs/operacao.md, docs/privacidade.md e docs/mcp-e-ia.md).
anzol:
  # ANZOL_ALLOWED_HOSTS: nomes aceitos no Host de /token, /share e /mcp (contra DNS rebinding) e no Origin dos
  # métodos que mudam estado (contra CSRF). Sem o nome pelo qual o navegador chega, a tela abre mas a API (criar
  # URL, ler mensagens) responde 403 {"error":"host not allowed"} ou {"error":"origin not allowed"}.
  # O chart monta a lista: localhost, 127.0.0.1 e [::1] (o port-forward), cada host de `ingress.hosts` (e, se ele
  # estiver em `ingress.tls`, também `host:443`, porque o Ingress fala HTTP com o pod) e os nomes daqui.
  # Acrescente aqui o nome de um acesso que não seja o Ingress (ex. um LoadBalancer). "*" desliga a conferência: inseguro.
  allowedHosts: []
  # ANZOL_MAX_REQUESTS: mensagens por URL sem `auto_cleanup`; acima disso sai a mais antiga.
  maxRequests: 10000
  # ANZOL_EXPIRY: segundos até um token e suas mensagens expirarem (renovado a cada uso).
  expiry: 604800
  # ANZOL_FAULT_HOLD_MAX: segundos, no máximo, que as falhas `hang` e `stall_after_headers` das regras prendem a
  # conexão; ela fecha antes se o cliente desistir.
  faultHoldMax: 300
  outbound:
    # ANZOL_OUTBOUND_ALLOW_PRIVATE: replay e send também para loopback e redes privadas. No cluster, isso inclui
    # o Redis, a API do Kubernetes e todo Service: deixe false com o app publicado.
    allowPrivate: false
    # ANZOL_OUTBOUND_LOCALHOST_ALIAS: nome que substitui localhost no alvo do replay e do send. Vazio: nenhum.
    localhostAlias: ""
  mcp:
    # ANZOL_MCP_ENABLED: servidor MCP em /mcp. Não tem autenticação: não ligue com o app publicado.
    enabled: false
  ai:
    # ANZOL_AI_ENABLED: rotas rules/suggest e explain com um LLM OpenAI-compatível. Desligada, respondem 503.
    enabled: false
    # ANZOL_AI_BASE_URL: raiz do servidor, sem o /v1.
    baseUrl: http://localhost:8000
    modelJson: NVIDIA-Nemotron-3.5-Lightning-30B-A3B-4bit
    modelText: KAT-Coder-V2.5-Dev-oQ4e-mtp
    # ANZOL_AI_API_KEY sempre por Secret, nunca em texto no Deployment. Ou o nome de um Secret já existente
    # (existingSecret, chave existingSecretKey), ou a chave na instalação, que vira o Secret <release>-ai:
    #   helm install anzol ./helm -f valores.yaml --set-string anzol.ai.apiKey="$ANZOL_AI_API_KEY"
    # Nunca escreva a chave num arquivo de values versionado. Sem as duas, o pedido ao LLM sai sem Authorization.
    existingSecret: ""
    existingSecretKey: ANZOL_AI_API_KEY
    apiKey: ""

# Métricas, traces e logs por OTLP: as variáveis OTEL_* padrão do OpenTelemetry, que o Spring Boot lê. Vazio (o
# padrão) nada é exportado; com o coletor fora do ar o app segue normal. Ex.:
#   OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy.monitoring:4318
#   OTEL_METRICS_EXPORTER: otlp
#   OTEL_SERVICE_NAME: anzol
#   OTEL_RESOURCE_ATTRIBUTES: deployment.environment=k8s
otel: {}

# Heap da JVM em relação ao limite de memória do container (o padrão da JVM é 25%).
javaToolOptions: -XX:MaxRAMPercentage=75

# Variáveis a mais, na forma de `env` do Kubernetes (aceita valueFrom). Ex. a senha de um Redis externo:
#   - name: SPRING_DATA_REDIS_PASSWORD
#     valueFrom: {secretKeyRef: {name: redis-externo, key: password}}
extraEnv: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi

redis:
  # Redis externo: com `host` preenchido, o chart não cria o Redis e o app usa este.
  external:
    host: ""
    port: 6379
  # Redis do chart (StatefulSet com PVC), usado quando `external.host` está vazio.
  image:
    repository: redis
    tag: 8.10.2-alpine
    pullPolicy: IfNotPresent
  # Teto de memória, como no docker-compose.yml: cheio, o Redis recusa gravação (o webhook responde 507) em vez de
  # despejar chaves (noeviction). O limite de memória do container precisa ficar acima dele.
  maxmemory: 1gb
  # O dump.rdb vai para /data, neste volume: tokens e mensagens sobrevivem ao restart do pod.
  persistence:
    size: 2Gi
    # Vazio: a StorageClass padrão do cluster.
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1536Mi
