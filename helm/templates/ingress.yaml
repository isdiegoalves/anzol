apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: anzol
  namespace: anzol
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - host: anzol.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: anzol
            port: 
              number: 8084