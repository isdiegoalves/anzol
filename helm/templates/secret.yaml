{{- if and .Values.webhook.ai.apiKey (not .Values.webhook.ai.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "anzol.aiSecretName" . }}
  labels:
    {{- include "anzol.labels" (dict "ctx" . "component" "app") | nindent 4 }}
type: Opaque
data:
  WEBHOOK_AI_API_KEY: {{ .Values.webhook.ai.apiKey | b64enc | quote }}
{{- end }}
