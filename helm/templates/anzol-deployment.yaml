apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: anzol
  name: anzol
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anzol
  template:
    metadata:
      labels:
        app: anzol
    spec:
      containers:
        - name: anzol
          args:
            - php
            - artisan
            - queue:work
            - --daemon
            - --tries=3
            - --timeout=10
          env:
            - name: APP_DEBUG
              value: "true"
            - name: APP_ENV
              value: dev
            - name: APP_LOG
              value: errorlog
            - name: APP_URL
              value: http://127.0.0.1:8084
            - name: BROADCAST_DRIVER
              value: redis
            - name: CACHE_DRIVER
              value: redis
            - name: DB_CONNECTION
              value: sqlite
            - name: ECHO_HOST_MODE
              value: path
            - name: QUEUE_DRIVER
              value: redis
            - name: REDIS_HOST
              value: redis:6379
          image: ghcr.io/isdiegoalves/anzol
          ports:
            - containerPort: 80
              protocol: TCP
      restartPolicy: Always
