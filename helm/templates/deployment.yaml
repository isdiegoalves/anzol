{{- $aiSecret := include "anzol.aiSecretName" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "anzol.fullname" . }}
  labels:
    {{- include "anzol.labels" (dict "ctx" . "component" "app") | nindent 4 }}
spec:
  # Assinantes do SSE e do `requests/wait` ficam em memória: com duas réplicas, a mensagem gravada numa não avisa
  # quem escuta na outra.
  replicas: 1
  selector:
    matchLabels:
      {{- include "anzol.selectorLabels" (dict "ctx" . "component" "app") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "anzol.selectorLabels" (dict "ctx" . "component" "app") | nindent 8 }}
      {{- if and .Values.webhook.ai.apiKey (not .Values.webhook.ai.existingSecret) }}
      annotations:
        # Chave nova no upgrade reinicia o pod (a variável só é lida na partida).
        checksum/ai-secret: {{ .Values.webhook.ai.apiKey | sha256sum }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        # O usuário `webhook` do Dockerfile.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: anzol
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: REDIS_HOST
              value: {{ .Values.redis.external.host | default (include "anzol.redisName" .) | quote }}
            - name: REDIS_PORT
              value: {{ ternary .Values.redis.external.port 6379 (ne .Values.redis.external.host "") | quote }}
            - name: WEBHOOK_ALLOWED_HOSTS
              value: {{ include "anzol.allowedHosts" . | quote }}
            - name: WEBHOOK_MAX_REQUESTS
              value: {{ .Values.webhook.maxRequests | quote }}
            - name: WEBHOOK_EXPIRY
              value: {{ .Values.webhook.expiry | quote }}
            - name: WEBHOOK_FAULT_HOLD_MAX
              value: {{ .Values.webhook.faultHoldMax | quote }}
            - name: WEBHOOK_OUTBOUND_ALLOW_PRIVATE
              value: {{ .Values.webhook.outbound.allowPrivate | quote }}
            - name: WEBHOOK_OUTBOUND_LOCALHOST_ALIAS
              value: {{ .Values.webhook.outbound.localhostAlias | quote }}
            - name: WEBHOOK_MCP_ENABLED
              value: {{ .Values.webhook.mcp.enabled | quote }}
            - name: WEBHOOK_AI_ENABLED
              value: {{ .Values.webhook.ai.enabled | quote }}
            - name: WEBHOOK_AI_BASE_URL
              value: {{ .Values.webhook.ai.baseUrl | quote }}
            - name: WEBHOOK_AI_MODEL_JSON
              value: {{ .Values.webhook.ai.modelJson | quote }}
            - name: WEBHOOK_AI_MODEL_TEXT
              value: {{ .Values.webhook.ai.modelText | quote }}
            {{- if $aiSecret }}
            - name: WEBHOOK_AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $aiSecret }}
                  key: {{ ternary .Values.webhook.ai.existingSecretKey "WEBHOOK_AI_API_KEY" (ne .Values.webhook.ai.existingSecret "") }}
            {{- end }}
            {{- range $name, $value := .Values.otel }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.javaToolOptions | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # Sem actuator: GET / é o index.html da tela, lido do jar (não toca no Redis nem confere o Host).
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            timeoutSeconds: 3
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # O Tomcat embutido e a JVM escrevem em /tmp.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
