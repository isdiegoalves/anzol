<div class="search" role="search" aria-label="Filter requests" i18n-aria-label>
  <label class="pill">
    <app-icon name="search" [size]="18" />
    <input
      #box
      class="text"
      type="text"
      name="search"
      aria-label="Search"
      i18n-aria-label
      placeholder="Search path, headers, body"
      i18n-placeholder
      maxlength="200"
      autocomplete="off"
      enterkeyhint="search"
      title="Search (/)"
      i18n-title
      [value]="draft()"
      (input)="draft.set(box.value)"
    />
  </label>
  <div class="chips" role="group" aria-label="Filters" i18n-aria-label>
    @for (chip of chips(); track chip.label) {
      <button type="button" class="chip" [attr.aria-pressed]="chip.pressed" (click)="chip.toggle()">
        {{ chip.label }}
      </button>
    }
  </div>
  <div class="row">
    <button
      i18n
      type="button"
      class="link"
      [disabled]="!store.filtering() && draft() === ''"
      (click)="clearFilters()"
    >
      Clear filters
    </button>
    <button i18n type="button" class="link" (click)="copyWaitFor()">Copy as anzol wait-for</button>
  </div>
  @if (copied(); as message) {
    <p class="note" role="status">{{ message }}</p>
  }
  @if (store.filtering()) {
    <p i18n class="count" role="status">{{ store.matched() }} of {{ store.total() }} requests</p>
  }
</div>
