<div class="search" role="search" aria-label="Filter requests" i18n-aria-label>
  <div class="line">
    <label class="pill">
      <app-icon name="search" [size]="18" />
      <input
        #box
        class="text"
        type="text"
        name="search"
        aria-label="Search"
        i18n-aria-label
        placeholder="Search path, IP, header or body"
        i18n-placeholder
        maxlength="200"
        autocomplete="off"
        enterkeyhint="search"
        title="Search (/)"
        i18n-title
        [value]="draft()"
        (input)="draft.set(box.value)"
      />
      <!-- INBOX-08: o atalho que já existe, à vista (o title do campo também o diz). -->
      <kbd class="key" aria-hidden="true">/</kbd>
    </label>
    <!-- B1 (UX-04): os chips ficam atrás deste botão; só os ligados ficam à vista, abaixo. -->
    <button
      type="button"
      class="filters"
      aria-keyshortcuts="F"
      title="Filters (F)"
      i18n-title
      [class.on]="chips.active().length > 0"
      [attr.aria-expanded]="open()"
      [attr.aria-controls]="open() ? panelId : null"
      [attr.aria-label]="filtersName()"
      (click)="toggle(false)"
    >
      {{ filtersText() }}
      <app-icon [name]="open() ? 'up' : 'down'" [size]="16" />
    </button>
  </div>
  @if (open()) {
    <app-filter-panel [panelId]="panelId" (closed)="close()" />
  }
  @if (active().length > 0) {
    <ul class="active" aria-label="Active filters" i18n-aria-label>
      @for (item of active(); track item.label) {
        <li class="on">
          <span class="label">{{ item.label }}</span>
          <button
            type="button"
            class="remove"
            [attr.aria-label]="removeLabel(item.label)"
            [attr.title]="removeHint"
            (click)="item.remove()"
          >
            <app-icon name="close" [size]="14" />
          </button>
        </li>
      }
      <!-- INBOX-25: sem resultado, o "Clear filters" é o do estado vazio da lista. -->
      @if (!nothingMatches()) {
        <li>
          <button i18n type="button" class="link" (click)="clearFilters()">Clear filters</button>
        </li>
      }
    </ul>
  }
  <!-- INBOX-10: só com filtro; diz que a busca é no servidor, sobre a URL inteira. Região viva
       persistente: recebe só o resultado, uma vez, depois que os filtros param de mudar. -->
  <!-- Sem filtro, a frase ("No filter. 34 requests.") fica só para o leitor de tela. -->
  <app-live-region class="count" [class.quiet]="!store.filtering()" [text]="result()" />
  <app-live-region class="note" [text]="waitFor.copied() ?? ''" />
</div>
