<div class="search" role="search" aria-label="Filter requests" i18n-aria-label>
  <label class="pill">
    <app-icon name="search" [size]="18" />
    <input
      #box
      class="text"
      type="text"
      name="search"
      aria-label="Search"
      i18n-aria-label
      placeholder="Search path, IP, header or body"
      i18n-placeholder
      maxlength="200"
      autocomplete="off"
      enterkeyhint="search"
      title="Search (/)"
      i18n-title
      [value]="draft()"
      (input)="draft.set(box.value)"
    />
    <!-- INBOX-08: o atalho que já existe, à vista (o title do campo também o diz). -->
    <kbd class="key" aria-hidden="true">/</kbd>
  </label>
  <div class="chips" role="group" aria-label="Filters" i18n-aria-label>
    @for (chip of chips().main; track chip.label) {
      <button type="button" class="chip" [attr.aria-pressed]="chip.pressed" (click)="chip.toggle()">
        {{ chip.label }}
      </button>
    }
    <button
      i18n
      type="button"
      class="chip more"
      [attr.aria-expanded]="moreOpen()"
      (click)="moreOpen.set(!moreOpen())"
    >
      More filters
    </button>
    @for (chip of chips().more; track chip.label) {
      @if (moreOpen() || chip.pressed) {
        <button
          type="button"
          class="chip"
          [attr.aria-pressed]="chip.pressed"
          (click)="chip.toggle()"
        >
          {{ chip.label }}
        </button>
      }
    }
  </div>
  <div class="row">
    <!-- INBOX-25: sem resultado, o "Clear filters" é o do estado vazio da lista. -->
    @if (!nothingMatches()) {
      <button
        i18n
        type="button"
        class="link"
        [disabled]="!store.filtering() && draft() === ''"
        (click)="clearFilters()"
      >
        Clear filters
      </button>
    }
    <button i18n type="button" class="link" (click)="copyWaitFor()">Copy as anzol wait-for</button>
  </div>
  @if (copied(); as message) {
    <p class="note" role="status">{{ message }}</p>
  }
  <!-- INBOX-10: só com filtro; e diz que a busca é no servidor, sobre a URL inteira. -->
  @if (store.filtering()) {
    <p class="count" role="status">{{ statusLine() }}</p>
  }
</div>
