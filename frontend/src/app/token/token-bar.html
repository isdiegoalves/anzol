<mat-toolbar class="bar">
  <a class="brand" routerLink="/">&#x2693;&#xFE0F; Webhook Tester</a>
  <nav class="links" aria-label="Project links">
    <a href="https://github.com/fredsted/webhook.site" target="_blank" rel="noopener"
      >Github Page</a
    >
    <a href="https://github.com/fredsted/webhook.site#donate" target="_blank" rel="noopener"
      >Donate</a
    >
    <a href="https://twitter.com/fredsted" target="_blank" rel="noopener">&#64;fredsted</a>
  </nav>
  @if (tokens.token(); as token) {
    <nav class="views" aria-label="Views">
      <a
        mat-button
        [routerLink]="['/', token.uuid]"
        [class.active]="!onRules()"
        [attr.aria-current]="onRules() ? null : 'page'"
        >Requests</a
      >
      <a
        mat-button
        [routerLink]="['/', token.uuid, 'rules']"
        [class.active]="onRules()"
        [attr.aria-current]="onRules() ? 'page' : null"
        >Rules</a
      >
    </nav>
  }
  <span class="spacer"></span>
  <button mat-button type="button" class="edit" (click)="editUrl()">Edit</button>
  <input
    class="url"
    type="text"
    readonly
    aria-label="Webhook URL"
    [value]="tokens.webhookUrl()"
    (click)="selectAll($event)"
    (keyup.enter)="selectAll($event)"
  />
  <button mat-flat-button type="button" class="copy" [cdkCopyToClipboard]="tokens.webhookUrl()">
    Copy
  </button>
  <button mat-flat-button type="button" class="new" (click)="createUrl()">New</button>
</mat-toolbar>
