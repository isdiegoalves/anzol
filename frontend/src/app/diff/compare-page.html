@let current = state();
<main class="page" aria-label="Compare">
  @switch (current.kind) {
    @case ('loaded') {
      @if (twoPanes()) {
        <app-split
          class="split"
          label="Resize list and comparison"
          storageKey="compareListWidth"
          [min]="260"
          [max]="520"
          [(width)]="listWidth"
        >
          <section splitStart class="pane list-pane" aria-label="Request list">
            <app-request-list (openRequest)="chooseB($event)" />
          </section>
          <div splitEnd class="pane compare-pane">
            <app-request-compare [a]="current.a" [b]="current.b" />
          </div>
        </app-split>
      } @else {
        <div class="pane compare-pane">
          <app-request-compare [a]="current.a" [b]="current.b" />
        </div>
      }
    }
    @case ('missing') {
      <app-empty-state
        icon="search"
        heading="One of these requests is gone"
        text="It may have been deleted or cut by auto cleanup."
      >
        <a [routerLink]="['/', tokenId()]">Back to the Inbox</a>
      </app-empty-state>
    }
    @case ('failed') {
      <p class="error" role="alert">
        Could not load the requests to compare ({{ current.status }}). Try again later.
      </p>
    }
    @default {
      <p class="loading">Loading comparison&hellip;</p>
    }
  }
</main>
