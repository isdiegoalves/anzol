@let current = state();
<main class="page" aria-label="Compare" i18n-aria-label>
  @switch (current.kind) {
    @case ('loaded') {
      @if (twoPanes()) {
        <app-split
          class="split"
          label="Resize list and comparison"
          i18n-label
          storageKey="compareListWidth"
          [min]="260"
          [max]="520"
          [(width)]="listWidth"
        >
          <section splitStart class="pane list-pane" aria-label="Request list" i18n-aria-label>
            <app-request-list (openRequest)="chooseB($event)" />
          </section>
          <div splitEnd class="pane compare-pane">
            <app-request-compare [a]="current.a" [b]="current.b" />
          </div>
        </app-split>
      } @else {
        <div class="pane compare-pane">
          <app-request-compare [a]="current.a" [b]="current.b" />
        </div>
      }
    }
    @case ('missing') {
      <!-- B2 (CA-5): a comparação não abre com outra no lugar; diz qual lado falta. -->
      <app-empty-state
        icon="search"
        [heading]="current.text"
        text="It may have been deleted or cut by auto cleanup."
        i18n-text
      >
        <button type="button" (click)="chooseAnother(current.kept)">
          <span i18n>Choose another request</span>
        </button>
      </app-empty-state>
    }
    @case ('failed') {
      <p i18n class="error" role="alert">
        Could not load the requests to compare ({{ current.status }}). Try again later.
      </p>
    }
    @default {
      <p i18n class="loading">Loading comparison&hellip;</p>
    }
  }
</main>
