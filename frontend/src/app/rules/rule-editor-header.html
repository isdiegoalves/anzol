<header class="editor-header">
  @if (fields()) {
    @let nameInvalid = name().invalid && name().touched;
    <div class="name-field">
      <input
        matInput
        class="name-input"
        [formControl]="name()"
        aria-label="Name"
        i18n-aria-label
        placeholder="Rule name"
        i18n-placeholder
        maxlength="100"
        [attr.aria-invalid]="nameInvalid"
        [attr.aria-describedby]="nameInvalid ? errorId : null"
      />
      @if (nameInvalid) {
        <p class="field-error" [id]="errorId">{{ nameError() }}</p>
      }
    </div>
  } @else {
    <span class="name-field">{{ title() }}</span>
  }
  @if (unsaved()) {
    <span class="unsaved" i18n>Unsaved changes</span>
  }
  @if (fields()) {
    <mat-form-field class="priority" subscriptSizing="dynamic">
      <mat-label i18n>Priority</mat-label>
      <input
        matInput
        type="number"
        min="1"
        [formControl]="priority()"
        aria-label="Priority"
        i18n-aria-label
        title="Lowest first"
        i18n-title
      />
      <mat-error>{{ priorityError() }}</mat-error>
    </mat-form-field>
    <mat-slide-toggle [formControl]="enabled()" i18n>Enabled</mat-slide-toggle>
  }
  <span class="spacer"></span>
  @if (canDelete()) {
    <button
      mat-icon-button
      type="button"
      class="delete"
      aria-label="Delete rule"
      i18n-aria-label
      title="Delete rule"
      i18n-title
      (click)="deleteRule.emit()"
    >
      <app-icon name="trash" [size]="20" />
    </button>
  }
  <button mat-button type="button" (click)="discard.emit()" i18n>Discard</button>
  <button mat-flat-button type="button" [disabled]="!canSave()" (click)="save.emit()" i18n>
    Save
  </button>
</header>
