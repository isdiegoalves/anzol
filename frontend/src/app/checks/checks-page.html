<main class="page">
  <header class="page-head">
    <div>
      <h1 i18n>Checks</h1>
      <p class="lead" i18n>
        What this URL verifies on every request, how healthy that is, and how it answers.
      </p>
    </div>
    <nav class="jump" aria-label="On this page" i18n-aria-label>
      @for (item of sections; track item.id) {
        <a
          class="jump-link"
          [routerLink]="[]"
          [queryParams]="{ section: item.id }"
          [attr.aria-current]="section() === item.id ? 'location' : null"
          >{{ item.label }}</a
        >
      }
    </nav>
  </header>

  @if (ready()) {
    <div class="columns">
      <div class="column">
        <app-signature-card id="checks-signature" />
        <app-schema-card id="checks-schema" [schemaFrom]="schemaFrom()" />
      </div>
      <div class="column">
        <app-health-card id="checks-health" />
        <app-response-card id="checks-response" />
        <app-privacy-card id="checks-privacy" />
      </div>
    </div>
  } @else {
    <p class="loading" role="status" i18n>Loading this URL…</p>
  }
</main>
