<div class="options" role="group" aria-label="URL options">
  <!-- Redirect pelo navegador: vai para Outbound › Forward (legacy) na E7. -->
  <mat-slide-toggle
    title="Redirect incoming requests to another URL via XHR"
    [disabled]="!preferences.redirectUrl()"
    [checked]="preferences.redirectEnable()"
    (change)="preferences.redirectEnable.set($event.checked)"
    >Auto redirect</mat-slide-toggle
  >
  <button mat-button type="button" (click)="openRedirectSettings()">Settings...</button>
  <button mat-button type="button" [disabled]="!preferences.redirectUrl()" (click)="redirectNow()">
    Redirect Now
  </button>

  <!-- CORS: vai para Checks › Response na E5. -->
  <mat-slide-toggle
    title="Enable automatic CORS headers"
    [checked]="tokens.token()?.cors ?? false"
    (change)="toggleCors()"
    >Enable CORS <sup class="muted">BETA</sup></mat-slide-toggle
  >
</div>
