@let token = tokens.token();
@let open = token && !locked() ? token : null;
<div class="rail">
  <a
    class="brand"
    routerLink="/"
    aria-label="Webhook Tester"
    i18n-aria-label
    title="Webhook Tester"
    i18n-title
  >
    <app-icon name="anchor" [size]="24" />
    <span i18n class="brand-name" aria-hidden="true">Webhook Tester</span>
  </a>
  <button
    type="button"
    class="fab"
    aria-label="New URL"
    i18n-aria-label
    title="New URL (N)"
    i18n-title
    (click)="createUrl()"
  >
    <app-icon name="plus" [size]="24" />
    <span i18n class="fab-text" aria-hidden="true">New URL</span>
  </button>
  @if (open) {
    <nav class="destinations" aria-label="URL sections" i18n-aria-label>
      @for (destination of destinations; track destination.label) {
        @let here = current() === destination;
        <a
          class="destination"
          [routerLink]="link(destination, open.uuid)"
          [class.current]="here"
          [attr.aria-current]="here ? 'page' : null"
          [attr.title]="hint(destination)"
        >
          <span class="indicator"><app-icon [name]="destination.icon" [size]="22" /></span>
          <span class="label">{{ label(destination) }}</span>
        </a>
      }
    </nav>
  }
  <span class="spacer"></span>
  <button
    type="button"
    class="tool"
    aria-label="Settings"
    i18n-aria-label
    title="Settings"
    i18n-title
    [attr.aria-expanded]="sheet() === 'settings'"
    (click)="toggleSheet('settings')"
  >
    <app-icon name="settings" [size]="22" />
  </button>
  <button
    type="button"
    class="tool"
    aria-label="Help"
    i18n-aria-label
    title="Help and shortcuts (?)"
    i18n-title
    [attr.aria-expanded]="sheet() === 'help'"
    (click)="toggleSheet('help')"
  >
    <app-icon name="help" [size]="22" />
  </button>
</div>
<div class="workspace">
  @if (open) {
    <app-url-header />
  }
  <div class="content">
    <ng-container #unlockHost />
    @if (!locked()) {
      <router-outlet />
    }
  </div>
</div>
<ng-container #sheetHost />
