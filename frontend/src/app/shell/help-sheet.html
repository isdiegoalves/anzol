<section class="sheet" role="dialog" aria-labelledby="help-title">
  <header class="sheet-header">
    <h2 i18n id="help-title" tabindex="-1">Help</h2>
    <button type="button" class="close" aria-label="Close" i18n-aria-label (click)="closed.emit()">
      <app-icon name="close" [size]="20" />
    </button>
  </header>

  <h3 i18n>Keyboard shortcuts</h3>
  <table class="shortcuts" aria-label="Keyboard shortcuts" i18n-aria-label>
    <tbody>
      @for (shortcut of shortcuts; track shortcut.keys) {
        <tr>
          <th scope="row">
            <kbd>{{ shortcut.keys }}</kbd>
          </th>
          <td>{{ shortcut.action }}</td>
        </tr>
      }
    </tbody>
  </table>
  <p i18n class="note">Turn single-key shortcuts off in Settings.</p>

  <h3 i18n>About</h3>
  <p i18n>Webhook Tester, open source under the MIT license.</p>
  <ul class="links">
    <li>
      <a i18n href="https://github.com/fredsted/webhook.site" target="_blank" rel="noopener"
        >Github Page</a
      >
    </li>
    <li>
      <a i18n href="https://github.com/fredsted/webhook.site#donate" target="_blank" rel="noopener"
        >Donate</a
      >
    </li>
    <li>
      <a i18n href="https://twitter.com/fredsted" target="_blank" rel="noopener">&#64;fredsted</a>
    </li>
  </ul>
</section>
