<button
  type="button"
  class="trigger"
  aria-haspopup="menu"
  aria-keyshortcuts="U"
  [attr.aria-expanded]="open()"
  [attr.aria-controls]="open() ? id : null"
  [attr.aria-label]="triggerLabel()"
  [attr.title]="triggerHint"
  (click)="toggle()"
  (keydown.arrowdown)="openAt($event)"
>
  <span class="name">{{ name() }}</span>
  <app-icon name="down" [size]="18" />
</button>
@if (open()) {
  @if (compact()) {
    <div class="scrim" aria-hidden="true"></div>
  }
  <!-- Menu preso ao botão; no celular, a mesma lista numa folha inferior modal. -->
  <div
    class="panel"
    [class.sheet]="compact()"
    [id]="id"
    [attr.role]="boxed() ? 'dialog' : 'menu'"
    [attr.aria-modal]="compact() ? 'true' : null"
    [attr.aria-label]="compact() ? null : menuLabel"
    [attr.aria-labelledby]="compact() ? id + '-title' : null"
  >
    @if (compact()) {
      <header class="head">
        <h2 class="title" [id]="id + '-title'" i18n>URLs in this browser</h2>
        <button
          type="button"
          class="close"
          aria-label="Close"
          i18n-aria-label
          (click)="close(true)"
        >
          <app-icon name="close" [size]="20" />
        </button>
      </header>
    }
    @if (searchable()) {
      <input
        class="find"
        type="search"
        aria-label="Find a URL"
        i18n-aria-label
        placeholder="Find a URL"
        i18n-placeholder
        autocomplete="off"
        [value]="query()"
        (input)="search($event)"
      />
    }
    <!-- Na folha do celular e com a busca (um campo não cabe num `menu`), "URLs in this browser" é
         o nome da caixa, e o menu de dentro tem o dele. -->
    <div
      class="menu"
      [attr.role]="boxed() ? 'menu' : 'none'"
      [attr.aria-label]="boxed() ? chooseLabel : null"
    >
      @for (entry of shown(); track entry.uuid) {
        <button
          type="button"
          role="menuitemradio"
          tabindex="-1"
          class="item url"
          [attr.aria-checked]="entry.current"
          [attr.aria-label]="entry.label"
          (click)="choose(entry)"
        >
          <span class="mark" aria-hidden="true"></span>
          <span class="name">{{ entry.name }}</span>
          <code class="id">{{ entry.id5 }}</code>
          <span class="state">{{ entry.state }}</span>
        </button>
      }
      <hr class="rule" role="separator" />
      <button type="button" role="menuitem" tabindex="-1" class="item" (click)="run('newUrl')">
        <app-icon name="plus" [size]="18" />
        <span class="name" i18n>New URL…</span>
        <kbd aria-hidden="true">{{ 'N' }}</kbd>
      </button>
      <button type="button" role="menuitem" tabindex="-1" class="item" (click)="run('rename')">
        <app-icon name="settings" [size]="18" />
        <span class="name" i18n>Rename this URL…</span>
      </button>
      <button type="button" role="menuitem" tabindex="-1" class="item" (click)="run('forget')">
        <app-icon name="none" [size]="18" />
        <span class="name" i18n>Forget a URL…</span>
      </button>
    </div>
    <p class="foot" role="none">
      @if (available()) {
        <span i18n>Kept only in this browser.</span>
      } @else {
        <span i18n>This browser does not keep a list of URLs.</span>
      }
      <kbd aria-hidden="true">{{ 'U' }}</kbd>
    </p>
  </div>
}
