<button
  type="button"
  class="trigger"
  aria-haspopup="menu"
  aria-keyshortcuts="U"
  [attr.aria-expanded]="open()"
  [attr.aria-controls]="open() ? id : null"
  [attr.aria-label]="triggerLabel()"
  [attr.title]="triggerHint"
  (click)="toggle()"
  (keydown.arrowdown)="openAt($event)"
>
  <span class="name">{{ name() }}</span>
  <app-icon name="down" [size]="18" />
</button>
<ng-container #panelHost />
