@if (request().schema; as schema) {
  @if (schema.valid) {
    <p class="badge valid">Schema valid</p>
  } @else {
    <div class="badge invalid">
      <p>Schema invalid</p>
      <ul class="errors">
        @for (error of schema.errors; track $index) {
          <li>
            <code>{{ error.path || '(root)' }}</code> {{ error.message }}
          </li>
        }
      </ul>
    </div>
  }
}
