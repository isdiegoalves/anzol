@let current = request();
<app-request-view [request]="current" [token]="token()">
  <span class="actions" detailsActions>
    <a [href]="permalink()">Permalink</a>
    <a target="_blank" rel="noopener" [href]="rawUrl()">Raw content</a>
    <button mat-button type="button" class="copy-as" [matMenuTriggerFor]="copyMenu">
      Copy As &#9662;
    </button>
    <mat-menu #copyMenu="matMenu">
      @for (format of formats; track format) {
        <button mat-menu-item type="button" (click)="copyRequestAs(format)">
          {{ format }}
        </button>
      }
    </mat-menu>
  </span>

  <div class="content-actions">
    <button mat-button type="button" (click)="replayRequest()">Replay&hellip;</button>
    <button mat-button type="button" (click)="sendAsNew()">Send as new&hellip;</button>
    <button mat-button type="button" (click)="compareWith()">Compare with&hellip;</button>
    <button mat-button type="button" (click)="shareRequest()">Share read-only link&hellip;</button>
    <button
      mat-button
      type="button"
      title="Ask the local model why signature, schema and rules gave this result"
      [disabled]="ai.disabled() && !explaining()"
      (click)="toggleExplain()"
    >
      {{ explaining() ? 'Hide explanation' : 'Explain' }}
    </button>
    @if (ai.disabled()) {
      <span class="ai-off">{{ aiOffHint }}</span>
    }
    <button mat-button type="button" (click)="createRule()">Create rule from this request</button>
    @if (jsonBody()) {
      <button mat-button type="button" (click)="createSchema()">
        Create schema from this request
      </button>
    }
    @if (current.content) {
      <button mat-button type="button" (click)="copyPayload()">Copy payload</button>
    }
  </div>
  <ng-container #explainHost />
</app-request-view>
