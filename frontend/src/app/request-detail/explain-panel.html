<section class="panel" aria-label="Explanation" i18n-aria-label>
  <header class="title">
    <h3 i18n>Explain</h3>
    <span i18n class="note"
      >Written by the local model; check the facts before acting on them.</span
    >
  </header>
  @if (loading()) {
    <p class="wait" role="status">{{ waitHint }}</p>
  }
  @if (errors().length > 0) {
    <ul class="errors" role="alert">
      @for (message of errors(); track $index) {
        <li>{{ message }}</li>
      }
    </ul>
    @if (!disabled()) {
      <button i18n mat-stroked-button type="button" (click)="retry()">Try again</button>
    }
  }
  @if (explanation(); as text) {
    <app-markdown class="text" [text]="text" />
  }
</section>
