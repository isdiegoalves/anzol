<aside class="sidebar">
  <app-request-list (openRequest)="openRequest($event)" />
  @if (requests.hasRequests()) {
    <div class="delete-all">
      <button mat-flat-button type="button" (click)="deleteAllRequests()">
        Delete all requests
      </button>
    </div>
  }
</aside>
<main class="main">
  @if (!requests.hasRequests() || !preferences.hideTutorial()) {
    <app-tutorial [url]="tokens.webhookUrl()" />
  }
  @if (requests.hasRequests()) {
    <div class="toolbar">
      <app-request-nav (openRequest)="openRequest($event)" />
      <app-options-bar [request]="requests.selected()" />
    </div>
    @let request = requests.selected();
    @let token = tokens.token();
    @if (request && token) {
      <app-request-detail
        [request]="request"
        [token]="token"
        [page]="requests.pageOf(request.uuid)"
      />
    }
  }
</main>
