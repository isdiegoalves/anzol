spring:
  application:
    name: webhook-site
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    mapper:
      # Mantém a ordem de declaração dos campos, a mesma do JSON gravado pelo app antigo.
      sort-properties-alphabetically: false
  mvc:
    # O corpo cru é lido uma vez pelo LegacyRequestFilter; nenhum outro filtro pode consumi-lo.
    formcontent:
      filter:
        enabled: false
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB
      resolve-lazily: true
  web:
    resources:
      add-mappings: false

# Observabilidade (métricas, traces e logs por OTLP): DESLIGADA por padrão; testes e ./ci.sh não exportam nada.
# Quem liga é o ambiente, com as variáveis padrão do OpenTelemetry, que o Spring Boot 4.1 traduz para estas
# propriedades (docker-compose.yml): OTEL_EXPORTER_OTLP_ENDPOINT liga traces e logs (sem endpoint não há
# exportador) e OTEL_METRICS_EXPORTER=otlp liga as métricas.
management:
  otlp:
    metrics:
      export:
        enabled: false
        # Timers em segundos, como o Prometheus espera (o padrão do registro OTLP é milissegundos).
        base-time-unit: seconds
        step: 15s
  opentelemetry:
    # Coletor fora do ar: o exportador tenta de novo com espera crescente, e o desligamento aguarda o envio
    # pendente (até 10 s, o mesmo prazo do `docker stop`). Com 2 s por envio, as tentativas desistem antes.
    tracing:
      export:
        otlp:
          timeout: 2s
    logging:
      export:
        otlp:
          timeout: 2s
  tracing:
    sampling:
      # Uso local: toda requisição vira trace.
      probability: 1.0

server:
  port: 8080
  # nginx do app antigo: `large_client_header_buffers 4 8k`, ou seja, até 32 KB de linha de
  # requisição e cabeçalhos (a linha de 8 KB é cobrada pelo LegacyRequestFilter).
  max-http-request-header-size: 32KB
  tomcat:
    # Cabeçalhos da resposta: o padrão (8 KB no total) não comporta um valor templado no teto de 8 KiB
    # (MAX_RENDERED_HEADER) junto com os fixos; acima disto o Tomcat corta a resposta num 500 sem corpo.
    max-http-response-header-size: 64KB
    # O nginx do app antigo aceita estes caracteres crus na query e no caminho (ex.: `a[]=1`, `{"a":1}`).
    relaxed-query-chars: '",<,>,[,\,],^,`,{,|,}'
    relaxed-path-chars: '",<,>,[,\,],^,`,{,|,}'
    # O PHP não limita partes do multipart nem o tamanho do cabeçalho de cada parte; o teto que vale
    # é o corpo de 1 MiB do nginx (spring.servlet.multipart e LegacyRequestFilter). -1 = sem limite.
    max-part-count: -1
    max-part-header-size: 1MB
    max-parameter-count: -1

webhook:
  # Nomes aceitos no Host de /token, /token/**, /share/** e /mcp, contra DNS rebinding (sem porta casa qualquer porta).
  # O Origin dos métodos que mudam estado só passa na mesma porta do Host (ou com nome:porta na lista), contra CSRF.
  # Padrão fechado: loopback e host.docker.internal (vazio também vale o padrão). "*" desliga a conferência de Host e
  # Origin da gestão: INSEGURO, qualquer página aberta no navegador passa a usar a API (o /mcp continua no padrão).
  allowed-hosts: "${WEBHOOK_ALLOWED_HOSTS:localhost,127.0.0.1,[::1],host.docker.internal}"
  # Mensagens guardadas por URL sem limpeza automática (`auto_cleanup` nulo); acima disso saem as mais antigas.
  max-requests: ${WEBHOOK_MAX_REQUESTS:10000}
  expiry: ${WEBHOOK_EXPIRY:604800}
  stream:
    # Comentário periódico no SSE: mantém a conexão viva e descobre quem fechou a aba.
    heartbeat: 15s
  # Replay e send pelo servidor. Padrão seguro para publicar: só destinos públicos. O docker-compose.yml (uso local)
  # libera loopback e redes privadas e troca o `localhost` do alvo pelo host do Docker.
  outbound:
    allow-private: ${WEBHOOK_OUTBOUND_ALLOW_PRIVATE:false}
    localhost-alias: ${WEBHOOK_OUTBOUND_LOCALHOST_ALIAS:}
  # Servidor MCP em /mcp (Streamable HTTP) e IA local (LLM OpenAI-compatível, o oMLX do dono): os dois DESLIGADOS por
  # padrão (testes e ./ci.sh sem o LLM falso). Quem liga é o docker-compose.yml, que só publica no loopback. Sem chave ou
  # sem o LLM no ar o app sobe igual: o LLM só é chamado nas rotas de IA, que respondem 502 quando ele falha.
  mcp:
    enabled: ${WEBHOOK_MCP_ENABLED:false}
  ai:
    enabled: ${WEBHOOK_AI_ENABLED:false}
    # Raiz do servidor, sem o /v1: o cliente chama {base-url}/v1/chat/completions.
    base-url: ${WEBHOOK_AI_BASE_URL:http://localhost:8000}
    # Nunca em arquivo versionado nem em log; vazio = sem cabeçalho Authorization.
    api-key: ${WEBHOOK_AI_API_KEY:}
    # Regra sugerida (saída estruturada) e diagnóstico em texto: os modelos recomendados na descoberta do oMLX.
    model-json: ${WEBHOOK_AI_MODEL_JSON:NVIDIA-Nemotron-3.5-Lightning-30B-A3B-4bit}
    model-text: ${WEBHOOK_AI_MODEL_TEXT:KAT-Coder-V2.5-Dev-oQ4e-mtp}
    # Prazo da chamada inteira: modelo frio no oMLX leva de 9 a 31 s para carregar antes do primeiro token.
    timeout: 90s

spring.ai.mcp.server:
  enabled: ${webhook.mcp.enabled}
  protocol: STREAMABLE
  type: SYNC
  name: anzol
  version: 1.0.0
  instructions: >-
    Operates Anzol: create webhook URLs (tokens), read and wait for the requests they capture, set response
    rules, and replay or send requests through the server. Every tool takes the URL by its UUID (token_id); the
    webhook itself is any HTTP request to /{token_id} on this server.
  # Ferramentas registradas à mão (site.webhook.mcp), com o schema e os erros da API: sem varredura de anotações.
  annotation-scanner:
    enabled: false
  streamable-http:
    mcp-endpoint: /mcp
