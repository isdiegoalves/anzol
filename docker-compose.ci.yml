# Stack isolado do ./ci.sh, ao lado do app do dono (porta 8084, Redis `webhook-redis` com dados reais):
#   docker compose -p webhookci -f docker-compose.yml -f docker-compose.ci.yml ...
# O `-p webhookci` dá rede e volume próprios (webhookci_default, webhookci_redis-data), que o
# ./ci.sh apaga no fim com `down -v`. Aqui só muda o que o compose fixa e colidiria.
services:
  app:
    ports: !override
      - "8088:8080"
  redis:
    container_name: webhookci-redis
